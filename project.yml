name: Leaflow
options:
  bundleIdPrefix: com.leaflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.6
  Kanna:
    url: https://github.com/tid-kijyun/Kanna
    from: 5.3.0
targets:
  Leaflow:
    type: application
    platform: iOS
    sources:
      - path: src/swift/Leaflow
    dependencies:
      - package: SwiftSoup
      - package: Kanna
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # 原版 Info.plist 含 UILaunchScreen；缺省时 iOS 以兼容模式
        # letterbox 运行（上下黑边）——补生成键，模拟器/真机满屏。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.leaflow.app
        PRODUCT_NAME: Leaflow
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  LeaflowSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tools/ios-smoke
    dependencies:
      - target: Leaflow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Leaflow
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.leaflow.smoke-tests
schemes:
  Leaflow:
    build:
      targets:
        Leaflow: all
    test:
      targets:
        - LeaflowSmokeTests
