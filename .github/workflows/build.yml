name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ---------- 阶段 1：模拟器构建 + 启动冒烟 ----------

      - name: Build (iOS Simulator, generic destination)
        run: |
          set +e
          xcodebuild \
            -project Leaflow.xcodeproj \
            -scheme Leaflow \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          echo "xcodebuild exit: $?" >> build.log

      - name: Smoke test (boot simulator, install, launch, check alive)
        id: smoke
        run: |
          set +e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          echo "udid=$UDID" | tee smoke-result.txt
          if [ -z "$UDID" ]; then
            echo "smoke=SKIP (no simulator)" >> smoke-result.txt
            exit 0
          fi
          xcrun simctl boot "$UDID" 2>/dev/null
          sleep 20
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*Debug-iphonesimulator/Leaflow.app" -maxdepth 6 | head -1)
          echo "app=$APP" >> smoke-result.txt
          xcrun simctl install "$UDID" "$APP" 2>&1 | tee -a smoke-result.txt
          LAUNCH_OUT=$(xcrun simctl launch "$UDID" com.leaflow.app -smokeSettings 2>&1)
          echo "launch=$LAUNCH_OUT" >> smoke-result.txt
          sleep 15
          ALIVE=$(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null \
            | grep -c "UIKitApplication:com.leaflow.app" || true)
          echo "alive=$ALIVE" >> smoke-result.txt
          CRASH=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -ci leaflow || true)
          echo "crash_reports=$CRASH" >> smoke-result.txt
          xcrun simctl io "$UDID" screenshot sim-screenshot.png 2>/dev/null
          sleep 3
          xcrun simctl io "$UDID" screenshot sim-settings.png 2>/dev/null
          xcrun simctl shutdown "$UDID" 2>/dev/null
          cat smoke-result.txt

      # ---------- 阶段 2：未签名设备 IPA（TrollStore 用） ----------

      - name: Build (iOS device, unsigned, Release)
        run: |
          set +e
          xcodebuild \
            -project Leaflow.xcodeproj \
            -scheme Leaflow \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/device \
            build 2>&1 | tee device-build.log
          echo "xcodebuild exit: $?" >> device-build.log

      - name: Package unsigned IPA
        run: |
          set +e
          APP=$(find build/device -path "*Release-iphoneos/Leaflow.app" -maxdepth 5 | head -1)
          echo "app=$APP" | tee ipa-result.txt
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            rm -rf Payload
            mkdir Payload
            cp -R "$APP" Payload/
            zip -qry Leaflow-unsigned.ipa Payload
            ls -la Leaflow-unsigned.ipa | tee -a ipa-result.txt
            unzip -l Leaflow-unsigned.ipa | head -12 >> ipa-result.txt
          else
            echo "ipa=MISSING (device build failed)" >> ipa-result.txt
          fi
          cat ipa-result.txt

      # ---------- 错误提取（两个构建域合并） ----------

      - name: Extract unique errors
        run: |
          grep -E ": error:" build.log device-build.log 2>/dev/null \
            | sed 's/^.*error:/error:/' | sort -u > errors.txt || true
          grep -hcE ": error:" build.log device-build.log 2>/dev/null \
            | awk '{s+=$1} END {print s+0}' > error_count.txt || true
          echo "---- unique errors ----"
          cat errors.txt || true
          echo "---- total error lines ----"
          cat error_count.txt || true

      - name: Upload artifacts (IPA + logs + smoke)
        uses: actions/upload-artifact@v4
        with:
          name: leaflow-build-output
          path: |
            Leaflow-unsigned.ipa
            build.log
            device-build.log
            errors.txt
            error_count.txt
            smoke-result.txt
            ipa-result.txt
            sim-screenshot.png
            sim-settings.png
          if-no-files-found: warn
