name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # ARM 执行器容量不足时使用同版本 Intel 池，保留构建和样本门禁。
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ---------- 阶段 1：模拟器构建 + 启动冒烟 ----------

      - name: Build (iOS Simulator, generic destination)
        run: |
          set +e
          xcodebuild \
            -project Leaflow.xcodeproj \
            -scheme Leaflow \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "xcodebuild exit: $STATUS" >> build.log
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi

      - name: Rule sample self-test (-selfTestRules)
        id: selftest
        timeout-minutes: 12
        run: |
          set +e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          echo "udid=$UDID" | tee selftest-result.txt
          if [ -z "$UDID" ]; then
            echo "selftest=SKIP (no simulator)" >> selftest-result.txt
            exit 0
          fi
          xcrun simctl boot "$UDID" 2>/dev/null
          sleep 20
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*Debug-iphonesimulator/Leaflow.app" -maxdepth 6 | head -1)
          xcrun simctl install "$UDID" "$APP" 2>&1 | tee -a selftest-result.txt
          xcrun simctl launch --console --terminate-running-process \
            "$UDID" com.leaflow.app -selfTestRules > selftest.log 2>&1
          # 进程异常退出时 stdout 可丢；自测逐行写入 Documents/selftest.txt。
          DATA=$(xcrun simctl get_app_container "$UDID" com.leaflow.app data 2>/dev/null || true)
          if [ -n "$DATA" ] && [ -f "$DATA/Documents/selftest.txt" ]; then
            cat "$DATA/Documents/selftest.txt" >> selftest.log
          fi
          cat selftest.log >> selftest-result.txt
          echo "--- crash reports (sim, last 10m) ---" >> selftest-result.txt
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -iname "*Leaflow*" -mmin -10 >> selftest-result.txt 2>/dev/null || true
          echo "--- simulator log tail ---" >> selftest-result.txt
          xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "Leaflow"' 2>/dev/null | tail -30 >> selftest-result.txt || true
          PASS=$(grep -c "SELFTEST .* pass=true" selftest.log || true)
          FAIL=$(grep -c "SELFTEST .* pass=false" selftest.log || true)
          echo "selftest_pass=$PASS selftest_fail=$FAIL" | tee -a selftest-result.txt
          cat selftest-result.txt
          xcrun simctl shutdown "$UDID" 2>/dev/null
          python3 -I tools/record_build_evidence.py --samples-only

      - name: Collect failed self-test diagnostics
        if: failure() && steps.selftest.outcome == 'failure'
        timeout-minutes: 2
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          DATA=$(xcrun simctl get_app_container "$UDID" com.leaflow.app data 2>/dev/null || true)
          if [ -n "$DATA" ] && [ -f "$DATA/Documents/selftest.txt" ]; then
            cat "$DATA/Documents/selftest.txt" >> selftest.log
          fi
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "Leaflow"' > selftest-diagnostics.txt 2>&1 || true
          xcrun simctl terminate "$UDID" com.leaflow.app 2>/dev/null || true
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Smoke test (boot simulator, install, launch, check alive)
        id: smoke
        run: |
          set +e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          echo "udid=$UDID" | tee smoke-result.txt
          if [ -z "$UDID" ]; then
            echo "smoke=SKIP (no simulator)" >> smoke-result.txt
            exit 0
          fi
          xcrun simctl boot "$UDID" 2>/dev/null
          sleep 20
          APP=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*Debug-iphonesimulator/Leaflow.app" -maxdepth 6 | head -1)
          echo "app=$APP" >> smoke-result.txt
          xcrun simctl install "$UDID" "$APP" 2>&1 | tee -a smoke-result.txt
          LAUNCH_OUT=$(xcrun simctl launch "$UDID" com.leaflow.app -smokeSettings 2>&1)
          echo "launch=$LAUNCH_OUT" >> smoke-result.txt
          sleep 15
          ALIVE=$(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null \
            | grep -c "UIKitApplication:com.leaflow.app" || true)
          echo "alive=$ALIVE" >> smoke-result.txt
          CRASH=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -ci leaflow || true)
          echo "crash_reports=$CRASH" >> smoke-result.txt
          xcrun simctl io "$UDID" screenshot sim-screenshot.png 2>/dev/null
          sleep 3
          xcrun simctl io "$UDID" screenshot sim-settings.png 2>/dev/null
          # T-1601-E1：书源管理整链直启冒烟（-smokeSources）。
          xcrun simctl terminate "$UDID" com.leaflow.app 2>/dev/null
          sleep 2
          SRC_OUT=$(xcrun simctl launch "$UDID" com.leaflow.app -smokeSources 2>&1)
          echo "launch_sources=$SRC_OUT" >> smoke-result.txt
          sleep 12
          SRC_ALIVE=$(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null \
            | grep -c "UIKitApplication:com.leaflow.app" || true)
          echo "sources_alive=$SRC_ALIVE" >> smoke-result.txt
          xcrun simctl io "$UDID" screenshot sim-sources.png 2>/dev/null
          # T-1601-C2：默认书架首屏（无参数启动）空态冒烟。
          xcrun simctl terminate "$UDID" com.leaflow.app 2>/dev/null
          sleep 2
          SHELF_OUT=$(xcrun simctl launch "$UDID" com.leaflow.app 2>&1)
          echo "launch_bookshelf=$SHELF_OUT" >> smoke-result.txt
          sleep 10
          SHELF_ALIVE=$(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null \
            | grep -c "UIKitApplication:com.leaflow.app" || true)
          echo "bookshelf_alive=$SHELF_ALIVE" >> smoke-result.txt
          xcrun simctl io "$UDID" screenshot sim-bookshelf.png 2>/dev/null
          # T-1602：两种皮肤、快速面板及大字/iPad 截图，只用固定书籍模型，不伪造真机验收。
          for SKIN in classic apple; do
            xcrun simctl terminate "$UDID" com.leaflow.app 2>/dev/null
            TTS_OUT=$(xcrun simctl launch "$UDID" com.leaflow.app -smokeTtsPlayer -tts_player_skin "$SKIN" 2>&1)
            echo "launch_tts_$SKIN=$TTS_OUT" >> smoke-result.txt
            sleep 5
            TTS_ALIVE=$(xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -c "UIKitApplication:com.leaflow.app" || true)
            echo "tts_${SKIN}_alive=$TTS_ALIVE" >> smoke-result.txt
            xcrun simctl io "$UDID" screenshot "sim-tts-$SKIN.png" 2>/dev/null
          done
          xcrun simctl terminate "$UDID" com.leaflow.app 2>/dev/null
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch "$UDID" com.leaflow.app -smokeTtsPlayer -tts_player_skin apple 2>/dev/null
          sleep 5
          xcrun simctl io "$UDID" screenshot sim-tts-dark.png 2>/dev/null
          xcrun simctl terminate "$UDID" com.leaflow.app 2>/dev/null
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          xcrun simctl launch "$UDID" com.leaflow.app -smokeTtsQuick 2>/dev/null
          sleep 5
          xcrun simctl io "$UDID" screenshot sim-tts-quick-large.png 2>/dev/null
          CRASH=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -ci leaflow || true)
          echo "crash_reports=$CRASH" >> smoke-result.txt
          xcrun simctl shutdown "$UDID" 2>/dev/null
          IPAD=$(xcrun simctl list devices available | grep -m1 "iPad" | grep -oE '[0-9A-F-]{36}')
          if [ -n "$IPAD" ]; then
            xcrun simctl boot "$IPAD" 2>/dev/null
            xcrun simctl bootstatus "$IPAD" -b
            xcrun simctl install "$IPAD" "$APP"
            xcrun simctl launch "$IPAD" com.leaflow.app -smokeTtsPlayer -tts_player_skin classic
            sleep 5
            xcrun simctl io "$IPAD" screenshot sim-tts-ipad.png 2>/dev/null
            xcrun simctl shutdown "$IPAD" 2>/dev/null
          fi
          cat smoke-result.txt

      - name: UI smoke (real gestures and rendered pages)
        run: |
          set +e
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID" 2>/dev/null
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" content_size large
          xcrun simctl ui "$UDID" appearance light
          xcodebuild test \
            -project Leaflow.xcodeproj -scheme Leaflow \
            -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO -resultBundlePath ui-smoke.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ui-smoke.log
          STATUS=${PIPESTATUS[0]}
          echo "ui_test_exit=$STATUS" > ui-smoke-result.txt
          xcrun xcresulttool export attachments --path ui-smoke.xcresult --output-path ui-screenshots
          xcrun xcresulttool export diagnostics --path ui-smoke.xcresult --output-path ui-diagnostics
          xcrun simctl spawn "$UDID" log show --last 20m --style compact \
            --predicate 'process == "Leaflow"' > ui-app.log 2>&1
          mkdir -p ui-crashes
          find ~/Library/Logs/DiagnosticReports -maxdepth 2 -type f -iname '*Leaflow*' \
            -exec cp {} ui-crashes/ \;
          CRASH=$(find ui-crashes -type f | wc -l | tr -d ' ')
          echo "crash_reports=$CRASH" >> ui-smoke-result.txt
          xcrun simctl shutdown "$UDID" 2>/dev/null
          exit "$STATUS"

      # ---------- 阶段 2：未签名设备 IPA（TrollStore 用） ----------

      - name: Build (iOS device, unsigned, Release)
        run: |
          set +e
          xcodebuild \
            -project Leaflow.xcodeproj \
            -scheme Leaflow \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/device \
            build 2>&1 | tee device-build.log
          STATUS=${PIPESTATUS[0]}
          echo "xcodebuild exit: $STATUS" >> device-build.log
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi

      - name: Package unsigned IPA
        run: |
          set +e
          APP=$(find build/device -path "*Release-iphoneos/Leaflow.app" -maxdepth 5 | head -1)
          echo "app=$APP" | tee ipa-result.txt
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            rm -rf Payload
            mkdir Payload
            cp -R "$APP" Payload/
            zip -qry Leaflow-unsigned.ipa Payload
            ls -la Leaflow-unsigned.ipa | tee -a ipa-result.txt
            unzip -l Leaflow-unsigned.ipa | head -12 >> ipa-result.txt
          else
            echo "ipa=MISSING (device build failed)" >> ipa-result.txt
          fi
          cat ipa-result.txt

      # ---------- 错误提取（两个构建域合并） ----------

      - name: Extract unique errors
        if: always()
        run: |
          grep -E ": error:" build.log device-build.log 2>/dev/null \
            | sed 's/^.*error:/error:/' | sort -u > errors.txt || true
          grep -hcE ": error:" build.log device-build.log 2>/dev/null \
            | awk '{s+=$1} END {print s+0}' > error_count.txt || true
          echo "---- unique errors ----"
          cat errors.txt || true
          echo "---- total error lines ----"
          cat error_count.txt || true

      # 硬门禁：构建错误 > 0 或自测有 fail → job 失败（此前 set +e
      # 会把含错误的构建也标 success）。
      - name: Enforce gates (zero errors + zero self-test failures)
        if: always()
        run: |
          python3 -I tools/record_build_evidence.py --require-ui-smoke
          COUNT=$(cat error_count.txt 2>/dev/null || echo 0)
          PASS=$(grep -c "SELFTEST .* pass=true" selftest.log 2>/dev/null || true)
          FAIL=$(grep -c "SELFTEST .* pass=false" selftest.log 2>/dev/null || true)
          echo "errors=$COUNT selftest_pass=$PASS selftest_fail=$FAIL"
          if [ "${COUNT:-0}" -ne 0 ]; then
            echo "::error::build errors=$COUNT"
            exit 1
          fi
          if [ "${FAIL:-0}" -ne 0 ]; then
            echo "::error::self-test failures=$FAIL"
            exit 1
          fi
          # 自测未跑起来（0 pass）同样视为失败（run6 静默 0/0 防护）。
          if [ "${PASS:-0}" -lt 23 ]; then
            echo "::error::self-test did not complete ($PASS/23)"
            exit 1
          fi

      - name: Upload artifacts (IPA + logs + smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaflow-build-output
          path: |
            Leaflow-unsigned.ipa
            build.log
            device-build.log
            errors.txt
            error_count.txt
            last_build.json
            last_selftest.json
            smoke-result.txt
            selftest-result.txt
            selftest.log
            selftest-diagnostics.txt
            ipa-result.txt
            sim-screenshot.png
            sim-settings.png
            sim-sources.png
            sim-bookshelf.png
            sim-tts-*.png
            ui-smoke.log
            ui-smoke-result.txt
            ui-screenshots/
            ui-diagnostics/
            ui-crashes/
            ui-app.log
          if-no-files-found: warn
